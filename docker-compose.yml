services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: queueup-api
    restart: unless-stopped
    environment:
      APP_PORT: "8080"
      DATABASE_URL: postgres://${DB_USER:-queueup}:${DB_PASSWORD:-queueup}@db-postgres:5432/${DB_NAME:-queueup}?sslmode=${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db-postgres:
        condition: service_healthy

  db-postgres:
    image: postgres:16-alpine
    container_name: queueup-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-queueup}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-queueup}
      POSTGRES_DB: ${DB_NAME:-queueup}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-queueup} -d ${DB_NAME:-queueup}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: queueup-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@queueup.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      db-postgres:
        condition: service_healthy

volumes:
  pgdata:
