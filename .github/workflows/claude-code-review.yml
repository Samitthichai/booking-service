name: Claude Code Review

on:
  pull_request:
    branches: [dev]
    # No `synchronize`: review once when the PR is opened or marked ready, not on every push.
    # To review again after changes, re-run the job from the Actions tab.
    types: [opened, ready_for_review, reopened]
    # Skip PRs that only touch docs or CI config.
    paths-ignore:
      - "**/*.md"
      - ".github/**"

# Only one review per PR at a time; a newer run cancels the older one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Read-only access so the review can fetch the PR diff and open repo files.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh search:*),Read,Grep,Glob"
          # Run sub-agents in the foreground: in CI the run ends when the main agent's turn ends,
          # which killed the background eligibility check before the review started.
          settings: '{"env": {"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1"}}'
